<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">DAWN — Build with curiosity. Think with clarity.</title>
  <desc id="desc">A warm sunrise over a dark teal landscape, with an abstract connected graph representing retrieval and reasoning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101C2B"/><stop offset="1" stop-color="#173D43"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#F7B875" stop-opacity=".35"/><stop offset="1" stop-color="#F7B875" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFE1AA"/><stop offset="1" stop-color="#E99660"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CBE7DF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="clip"><rect width="960" height="280" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="960" height="280" fill="url(#bg)"/>
    <rect width="960" height="280" fill="url(#grid)"/>
    <circle cx="776" cy="170" r="192" fill="url(#glow)"/>
    <circle cx="776" cy="170" r="66" fill="url(#sun)"/>
    <path d="M525 249C642 192 667 223 729 205S873 179 960 211V280H525Z" fill="#244D51"/>
    <path d="M455 280C561 237 626 258 709 228S869 235 960 216V280Z" fill="#15343D"/>
    <path d="M565 280C682 243 813 274 960 248V280Z" fill="#102832"/>
    <path d="M632 75L689 45L747 76L810 44L867 78M689 45L714 117L747 76L809 123L867 78M714 117L809 123" fill="none" stroke="#87CEC3" stroke-opacity=".45" stroke-width="1.3"/>
    <g fill="#9EDFD0">
      <circle cx="632" cy="75" r="3"/><circle cx="689" cy="45" r="4"/><circle cx="747" cy="76" r="3"/>
      <circle cx="810" cy="44" r="3"/><circle cx="867" cy="78" r="4"/><circle cx="714" cy="117" r="3"/><circle cx="809" cy="123" r="3"/>
    </g>
    <rect x="48" y="44" width="26" height="3" rx="1.5" fill="#F6BD83"/>
    <text x="85" y="49" fill="#A4CEC8" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="3">IDEAS INTO PRACTICE</text>
    <text x="46" y="132" fill="#F4F3EB" font-family="Segoe UI,Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="7">DAWN</text>
    <text x="50" y="172" fill="#F4C99C" font-family="Segoe UI,Arial,sans-serif" font-size="20">Build with curiosity. Think with clarity.</text>
    <text x="50" y="223" fill="#A4CEC8" font-family="Consolas,monospace" font-size="12" letter-spacing="1.5">LLM  /  RAG  /  AGENTS</text>
  </g>
